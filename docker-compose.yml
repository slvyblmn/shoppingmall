services:
  mysql:
    image: mysql:8.0
    container_name: shoppingmall-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: shoppingmall
      MYSQL_USER: root
      MYSQL_PASSWORD: 0626
      TZ: Asia/Seoul
    ports:
      - "3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - shoppingmall-mysql-data:/var/lib/mysql
volumes:
  shoppingmall-mysql-data: