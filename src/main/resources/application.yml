spring:
  datasource:
    url: jdbc:mysql://localhost:3306/shoppingmall?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: shop
    password: shop1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100

jwt:
  secret: ${JWT_SECRET:c2hvcC1iYWNrZW5kLWxvY2FsLWRldmVsb3BtZW50LXNlY3JldC1rZXktMjAyNiEh}
  access-token-validity-ms: 3600000

app:
  admin:
    email: ${ADMIN_EMAIL:admin@shop.com}
    password: ${ADMIN_PASSWORD:Admin1234!}

logging:
  level:
    org.hibernate.SQL: debug

portone:
  base-url: https://api.portone.io
  api-secret: ${PORTONE_API_SECRET:}
  store-id: ${PORTONE_STORE_ID:}
  channel-key: ${PORTONE_CHANNEL_KEY:}